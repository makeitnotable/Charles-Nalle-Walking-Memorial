name: Deploy to GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

env:
  # GH Pages project path for this repo; local dev and Vercel previews use "/"
  BASE: /Charles-Nalle-Walking-Memorial
  SITE: https://makeitnotable.github.io
  # Publishable client-side token (pk.) — add as a repo Actions secret so CI
  # builds carry it; the map degrades gracefully when absent. See playbook.
  PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
