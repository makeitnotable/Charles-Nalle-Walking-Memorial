name: Deploy to GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

env:
  # GH Pages project path for this repo; local dev and Vercel previews use "/"
  BASE: /Charles-Nalle-Walking-Memorial
  SITE: https://makeitnotable.github.io
  # Mapbox token comes from the committed .env.production (publishable pk.
  # token — see docs/DEVIATIONS.md). Setting a PUBLIC_MAPBOX_TOKEN Actions
  # secret here would override it; not required.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm to the version that generated the lockfile
        run: npm install -g npm@11

      # npm ci has failed opaquely on this repo across several lockfile
      # regenerations (macOS-authored lock, Linux runner). If it fails, surface
      # npm's own log in the Actions output, then fall back to npm install —
      # still lockfile-driven, and any real drift would fail the build step.
      - name: Install dependencies
        run: |
          npm ci || {
            echo '::group::npm ci failed — npm log tail'
            tail -80 "$(ls -t ~/.npm/_logs/*.log | head -1)" || true
            echo '::endgroup::'
            echo 'Falling back to npm install'
            rm -rf node_modules
            npm install --no-audit --no-fund
          }

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
