  <text x="24" y="70" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="-3" fill="#f6f3ee">C</text>
  <text x="56" y="106" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="-3" fill="#f26835">N</text>
</svg>
